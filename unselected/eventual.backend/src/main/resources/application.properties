spring.application.name=eventual-layered
server.port=8080

# DB connectivity
spring.datasource.url=jdbc:postgresql://localhost:5432/eventualdb
spring.datasource.name=eventualdb
spring.datasource.username=postgres
spring.datasource.password=postgres1

spring.devtools.restart.additional-paths=src/main/resources/static/

# Spring security (For Authentication)
jwt.secret=ZXZlbnR1YWwtc2VjcmV0LWtleS1mb3ItanctYXV0aGVudGljYXRpb24tMjAyNA==

# To store profile and events pics
file.upload-dir=uploads

# Elasticsearch connects to es01 which proxies the 3-node cluster
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.events-index=events
elasticsearch.groups-index=groups

# Ollama local embedding model server (run: docker exec ollama ollama pull nomic-embed-text)
ollama.host=localhost
ollama.port=11434
ollama.model=nomic-embed-text
