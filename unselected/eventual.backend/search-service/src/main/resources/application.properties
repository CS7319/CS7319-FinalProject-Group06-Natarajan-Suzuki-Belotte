spring.application.name=search-service
server.port=8084

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# Ollama embedding
ollama.base-url=http://localhost:11434
ollama.model=nomic-embed-text

# User Service URL (for sync calls to get user profile for recommendations)
user.service.url=http://localhost:8082

# Event Service URL (for sync calls to get user RSVPs for recommendations)
event.service.url=http://localhost:8081

# Elasticsearch indices
elasticsearch.events-index=events
elasticsearch.groups-index=groups

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=search-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
