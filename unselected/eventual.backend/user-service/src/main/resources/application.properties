spring.application.name=user-service
server.port=8082

# PostgreSQL — user-service owns the eventual_users database
spring.datasource.url=jdbc:postgresql://localhost:5432/eventual_users
spring.datasource.username=postgres
spring.datasource.password=postgres

# JWT
jwt.secret=ZXZlbnR1YWwtc2VjcmV0LWtleS1mb3ItanctYXV0aGVudGljYXRpb24tMjAyNA==

# File storage
upload.dir=uploads

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka topics (published by this service)
kafka.topics.group-indexed=group-indexed
kafka.topics.group-deleted=group-deleted
kafka.topics.join-request-submitted=join-request-submitted
kafka.topics.join-request-approved=join-request-approved
kafka.topics.join-request-rejected=join-request-rejected
