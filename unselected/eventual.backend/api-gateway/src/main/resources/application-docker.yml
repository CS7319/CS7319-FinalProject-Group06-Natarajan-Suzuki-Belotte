spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**

        - id: group-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/groups/**

        - id: category-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/categories/**

        - id: event-service
          uri: http://event-service:8081
          predicates:
            - Path=/api/events/**

        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/api/notifications/**

        - id: search-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/search/**

        - id: recommendation-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/recommendations/**

        - id: support-service
          uri: http://support-service:8085
          predicates:
            - Path=/api/support/**

        - id: vendor-service
          uri: http://vendor-service:8086
          predicates:
            - Path=/api/vendors/**
