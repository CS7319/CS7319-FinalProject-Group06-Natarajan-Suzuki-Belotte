spring.application.name=notification-service
server.port=8083

# PostgreSQL — notification-service owns the eventual_notifications database
spring.datasource.url=jdbc:postgresql://localhost:5432/eventual_notifications
spring.datasource.username=postgres
spring.datasource.password=postgres

# User Service URL (for fetching group members when notifying about new group events)
user.service.url=http://localhost:8082

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka topics (consumed by this service)
kafka.topics.event-created=event-created
kafka.topics.event-updated=event-updated
kafka.topics.event-deleted=event-deleted
kafka.topics.rsvp-created=rsvp-created
kafka.topics.rsvp-cancelled=rsvp-cancelled
kafka.topics.join-request-submitted=join-request-submitted
kafka.topics.join-request-approved=join-request-approved
kafka.topics.join-request-rejected=join-request-rejected
