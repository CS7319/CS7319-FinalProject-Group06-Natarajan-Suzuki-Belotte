version: '3.8'

# Eventual — Microservices Architecture
# PostgreSQL is expected to be running locally on the host machine.
# Each service connects to its own database — create them before starting:
#   createdb eventual_users eventual_events eventual_notifications eventual_vendors eventual_support

services:

  # Kafka (KRaft mode — no ZooKeeper needed)
  kafka:
    image: bitnami/kafka:3.7
    container_name: eventual-kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - microservices-net

  # Elasticsearch node 1 (primary — exposes port 9200)
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es01
    environment:
      - node.name=es01
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - ./docker/esdata01:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - microservices-net

  # Elasticsearch node 2
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es02
    environment:
      - node.name=es02
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/esdata02:/usr/share/elasticsearch/data
    networks:
      - microservices-net

  # Elasticsearch node 3
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es03
    environment:
      - node.name=es03
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/esdata03:/usr/share/elasticsearch/data
    networks:
      - microservices-net

  # Ollama (local embedding model server)
  # After first startup pull the model once:
  #   docker exec eventual-ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    container_name: eventual-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - microservices-net

  # User Service (port 8082) — database: eventual_users
  user-service:
    build:
      context: ./eventual.backend
      dockerfile: user-service/Dockerfile
    container_name: eventual-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-net
    restart: on-failure

  # Event Service (port 8081) — database: eventual_events
  event-service:
    build:
      context: ./eventual.backend
      dockerfile: event-service/Dockerfile
    container_name: eventual-event-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual_events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8082
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - microservices-net
    restart: on-failure

  # Search Service (port 8084) — no relational database (uses Elasticsearch)
  search-service:
    build:
      context: ./eventual.backend
      dockerfile: search-service/Dockerfile
    container_name: eventual-search-service
    ports:
      - "8084:8084"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://es01:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OLLAMA_BASE_URL: http://ollama:11434
      USER_SERVICE_URL: http://user-service:8082
      EVENT_SERVICE_URL: http://event-service:8081
    depends_on:
      kafka:
        condition: service_healthy
      es01:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
    networks:
      - microservices-net
    restart: on-failure

  # Notification Service (port 8083) — database: eventual_notifications
  notification-service:
    build:
      context: ./eventual.backend
      dockerfile: notification-service/Dockerfile
    container_name: eventual-notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual_notifications
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - microservices-net
    restart: on-failure

  # Vendor Service (port 8086) — database: eventual_vendors
  vendor-service:
    build:
      context: ./eventual.backend
      dockerfile: vendor-service/Dockerfile
    container_name: eventual-vendor-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual_vendors
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - microservices-net
    restart: on-failure

  # Support Service (port 8085) — database: eventual_support
  support-service:
    build:
      context: ./eventual.backend
      dockerfile: support-service/Dockerfile
    container_name: eventual-support-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual_support
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - microservices-net
    restart: on-failure

  # API Gateway (port 8080) — entry point for all client requests
  api-gateway:
    build:
      context: ./eventual.backend
      dockerfile: api-gateway/Dockerfile
    container_name: eventual-api-gateway
    ports:
      - "8080:8080"
    environment:
      # Activates application-docker.yml which overrides route URIs with container names
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - user-service
      - event-service
      - search-service
      - notification-service
      - vendor-service
      - support-service
    networks:
      - microservices-net
    restart: on-failure

  # Kibana (optional — inspect Elasticsearch indices)
  # only starts when: docker compose --profile kibana up
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: eventual-kibana
    environment:
      - ELASTICSEARCH_HOSTS=["http://es01:9200","http://es02:9200","http://es03:9200"]
    ports:
      - "5601:5601"
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - microservices-net
    profiles:
      - kibana

volumes:
  kafka-data:
  es-data01:
  es-data02:
  es-data03:
  ollama-data:
  uploads-data:

networks:
  microservices-net:
    driver: bridge
