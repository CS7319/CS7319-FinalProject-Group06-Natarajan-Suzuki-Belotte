<section class="mt-3">
  <div class="container">
    <div class="section box">
      <header class="title">Groups</header>
      <nav class="tags are-large">
        @for (socialGroup of socialGroups(); track socialGroup.id) {
          <a class="tag is-link" routerLink="/search" [queryParams]="{ group: socialGroup.id }">
            {{ socialGroup.name }}
          </a>
        }
      </nav>
    </div>

    <div class="section box">
      <header class="title">Events</header>

      <div class="fixed-grid has-4-cols">
        <div class="grid">
          @for (socialEvent of socialEvents(); track socialEvent.id) {
            <div class="cell">
              <a routerLink="/event/{{ socialEvent.id }}">
                <div class="card">
                  <div class="card-image">
                    <figure class="image">
                      <img
                        src="https://bulma.io/assets/images/placeholders/640x480.png"
                        alt="Placeholder image"
                      />
                    </figure>
                  </div>

                  <header class="card-header">
                    <p class="card-header-title">{{ socialEvent.title }}</p>
                    <button class="card-header-icon" aria-label="more options">
                      <span class="icon">
                        <i class="fas fa-angle-down" aria-hidden="true"></i>
                      </span>
                    </button>
                  </header>

                  <div class="card-content">
                    <div class="media">
                      <div class="media-left">
                        <figure class="image is-48x48">
                          <img
                            src="https://bulma.io/assets/images/placeholders/96x96.png"
                            alt="Placeholder image"
                          />
                        </figure>
                      </div>

                      <div class="media-content">
                        <p class="title is-4">{{ socialEvent.organizer_name }}</p>
                        <p class="subtitle is-6">@{{ socialEvent.organizer_email }}</p>
                      </div>
                    </div>

                    <div class="content">{{ socialEvent.description }}</div>
                  </div>
                </div>
              </a>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
