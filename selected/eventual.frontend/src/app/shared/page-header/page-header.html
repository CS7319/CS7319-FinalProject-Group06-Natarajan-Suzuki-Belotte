<header>
  <nav class="navbar" role="navigation">
    <div class="navbar-brand">
      <a class="navbar-item" routerLink="/search">
        <h1>Eventual</h1>
      </a>

      <a role="button" class="navbar-burger" data-target="navbarMain">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navbarMain" class="navbar-menu">
      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            @if (userInfo().email) {
              <a class="navbar-item" routerLink="/profile">Profile</a>
              <a class="button is-primary" (click)="OnLogOutClicked()">Log Out</a>
            } @else {
              <a class="button is-primary" (click)="onSignUpClicked()">Sign Up</a>
              <a class="button is-light" (click)="onLogInClicked()">Log In</a>
            }
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>

<div class="modal" id="loginModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Log In</p>
      <button class="delete is-large" aria-label="close" (click)="onCloseClicked()"></button>
    </header>
    <section class="modal-card-body">
      <div class="field">
        <label class="label" for="login-email">Email</label>
        <div class="control">
          <input
            class="input"
            id="login-email"
            type="text"
            placeholder="student@smu.edu"
            [formControl]="userAccount().email"
          />
        </div>
      </div>

      <div class="field">
        <label class="label" for="login-password">Password</label>
        <div class="control">
          <input
            class="input"
            id="login-password"
            type="password"
            [formControl]="userAccount().password"
          />
        </div>
      </div>
    </section>
    <footer class="modal-card-foot is-justify-content-center">
      <button class="button is-medium is-success" (click)="onLogInFormSubmitted()">Log In</button>
    </footer>
  </div>
</div>

<div class="modal" id="signupModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Sign Up</p>
      <button class="delete is-large" aria-label="close" (click)="onCloseClicked()"></button>
    </header>
    <section class="modal-card-body">
      <div class="field">
        <label class="label" for="signup-email">Email</label>
        <div class="control">
          <input
            class="input"
            id="signup-email"
            type="text"
            placeholder="student@smu.edu"
            [formControl]="userAccount().email"
          />
        </div>
      </div>

      <div class="field">
        <label class="label" for="signup-password">Password</label>
        <div class="control">
          <input
            class="input"
            id="signup-password"
            type="password"
            [formControl]="userAccount().password"
          />
        </div>
      </div>
    </section>
    <footer class="modal-card-foot is-justify-content-center">
      <button class="button is-medium is-success" (click)="onSignUpFormSubmitted()">Sign Up</button>
    </footer>
  </div>
</div>
