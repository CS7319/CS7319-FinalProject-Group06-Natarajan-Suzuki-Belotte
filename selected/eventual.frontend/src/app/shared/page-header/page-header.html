<header>
  <nav class="navbar" role="navigation">
    <div class="navbar-brand">
      <a class="navbar-item" routerLink="/search">
        <h1>Eventual</h1>
      </a>

      <a role="button" class="navbar-burger" data-target="navbarMain">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navbarMain" class="navbar-menu">
      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            @if (userInfo.email) {
              <a class="navbar-item" routerLink="/profile">Profile</a>
              <a class="button is-primary" (click)="logOut()">Log out</a>
            } @else {
              <a class="button is-primary" (click)="onSignUpClicked()">Sign up</a>
              <a class="button is-light" (click)="onLogInClicked()">Log in</a>
            }
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>

<div class="modal" id="loginModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Log In</p>
      <button class="delete" aria-label="close" (click)="onCloseClicked()"></button>
    </header>
    <section class="modal-card-body">LOGIN</section>
    <footer class="modal-card-foot">
      <div class="buttons">
        <button class="button is-success">Log in</button>
      </div>
    </footer>
  </div>
</div>

<div class="modal" id="signupModal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Sign Up</p>
      <button class="delete" aria-label="close" (click)="onCloseClicked()"></button>
    </header>
    <section class="modal-card-body">SIGNUP</section>
    <footer class="modal-card-foot">
      <div class="buttons">
        <button class="button is-success">Sign up</button>
      </div>
    </footer>
  </div>
</div>
