<section class="mt-3">
  <div class="container">
    <h2 class="title">Search</h2>

    @for (socialEvent of socialEvents; track socialEvent.id) {
      <div class="card">
        <div class="card-image">
          <figure class="image is-4by3">
            <img
              src="https://bulma.io/assets/images/placeholders/1280x960.png"
              alt="Placeholder image"
            />
          </figure>
        </div>

        <header class="card-header">
          <p class="card-header-title">{{ socialEvent.name }}</p>
          <button class="card-header-icon" aria-label="more options">
            <span class="icon">
              <i class="fas fa-angle-down" aria-hidden="true"></i>
            </span>
          </button>
        </header>

        <div class="card-content">
          <div class="media">
            <div class="media-left">
              <figure class="image is-48x48">
                <img
                  src="https://bulma.io/assets/images/placeholders/96x96.png"
                  alt="Placeholder image"
                />
              </figure>
            </div>

            <div class="media-content">
              <p class="title is-4">{{ socialEvent.host.name }}</p>
              <p class="subtitle is-6">@{{ socialEvent.host.handle }}</p>
            </div>
          </div>

          <div class="content">{{ socialEvent.description }}</div>
        </div>
      </div>
    }
  </div>
</section>
