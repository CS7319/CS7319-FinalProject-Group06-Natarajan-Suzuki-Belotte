version: '3.8'

# Eventual — Layered (N-Tier) Architecture
# PostgreSQL is expected to be running locally on the host machine.

services:

  # Elasticsearch node 1 (primary)
  # Port is intentionally not published to the host — the app reaches es01
  # over the internal Docker network. This avoids conflicts if Elasticsearch
  # is already running locally on port 9200.
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es01
    environment:
      - node.name=es01
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/esdata01:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks:
      - eventual-net

  # Elasticsearch node 2
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es02
    environment:
      - node.name=es02
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/esdata02:/usr/share/elasticsearch/data
    networks:
      - eventual-net

  # Elasticsearch node 3
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: eventual-es03
    environment:
      - node.name=es03
      - cluster.name=eventual-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/esdata03:/usr/share/elasticsearch/data
    networks:
      - eventual-net

  # Ollama (local embedding model server)
  # Port is intentionally not published to the host — the app reaches Ollama
  # over the internal Docker network. This avoids conflicts if Ollama is
  # already running locally on port 11434.
  # After first startup pull the model once:
  #   docker exec eventual-ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    container_name: eventual-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - eventual-net

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventual-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/eventual
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres1
      ELASTICSEARCH_HOST: es01
      ELASTICSEARCH_PORT: 9200
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      FILE_UPLOAD-DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - eventual-net
    restart: on-failure

  # Kibana (optional — inspect Elasticsearch indices)
  # only starts when: docker compose --profile kibana up
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: eventual-kibana
    environment:
      - ELASTICSEARCH_HOSTS=["http://es01:9200","http://es02:9200","http://es03:9200"]
    ports:
      - "5601:5601"
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - eventual-net
    profiles:
      - kibana

volumes:
  es-data01:
  es-data02:
  es-data03:
  ollama-data:
  uploads-data:

networks:
  eventual-net:
    driver: bridge
